name: Renderizar Reels MP4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        run: npx remotion browser ensure
      - name: Renderizar MP4
        run: npm run render
      - name: Publicar MP4
        uses: actions/upload-artifact@v4
        with:
          name: reels-onvideo-mp4
          path: out/video.mp4
          retention-days: 7
