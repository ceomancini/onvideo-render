name: Cooper - clipe produto 30 outubro
on:
  push:
    branches: [main]
    paths:
      - 'products/clip-20261030/**'
      - '.github/workflows/render-clip-20261030.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render Full HD MP4
        run: python3 products/clip-20261030/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: Cooper-Clip-Mercado-Livre-MP4
          path: products/clip-20261030/out/Cooper-Clip-Mercado-Livre.mp4
          if-no-files-found: error
          retention-days: 30
