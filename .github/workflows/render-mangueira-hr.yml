name: Renderizar Mangueira HR MP4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'products/mangueira-hr/**'
      - '.github/workflows/render-mangueira-hr.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/mangueira-hr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - run: npm run render -- --codec=h264 --pixel-format=yuv420p
      - uses: actions/upload-artifact@v4
        with:
          name: cooper-mangueira-hr-mp4
          path: products/mangueira-hr/out/video.mp4
          if-no-files-found: error
          retention-days: 30
